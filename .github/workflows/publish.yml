name: Publish to npm

# Runs when the ArcSync monorepo pushes a version tag here. npm trusted
# publishing authenticates the publish job over OIDC, so no npm token is stored
# anywhere, and --provenance links the tarball to this commit and run.
#
# Third-party code (dependencies, tests, the build) runs only in `build`, which
# holds no credential. `publish` gets the OIDC identity and installs nothing:
# it publishes the tarball `build` packed. `release` gets contents: write only.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run check-types
      - run: npm run test:coverage
      - run: npm run build
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: arcsync-mcp-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm's trusted publisher for arcsync-mcp is pinned to this workflow file
    # and this environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.19.1
      - run: npm publish ./arcsync-mcp-*.tgz --provenance --access public --ignore-scripts

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" -R "$REPO" --title "$TAG" \
            --notes "Published to npm as arcsync-mcp@${TAG#v}, with provenance: https://www.npmjs.com/package/arcsync-mcp/v/${TAG#v}"
